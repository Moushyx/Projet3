/* Corps & Méridiens 3D — feuille de style
   Univers visuel unique et assumé : planche anatomique nocturne.
   Toutes les couleurs sont peintes explicitement (pas de thème clair). */

:root {
  --ink: #0b1220;
  --ink-2: #101b2e;
  --ink-3: #17253c;
  --line: #24354f;
  --text: #edf2f9;
  --muted: #8fa1bd;
  --skin: #e8c9a8;
  --accent: #d9c3a5; /* prend la couleur du canal sélectionné */

  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- Barre supérieure ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px;
  background: var(--ink);
  border-bottom: 1px solid var(--line);
  z-index: 5;
}
.wordmark { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.wordmark h1 {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  margin: 0; white-space: nowrap;
}
.wordmark .tag {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500; letter-spacing: 0.14em;
  color: var(--muted); text-transform: uppercase; white-space: nowrap;
}

@media (max-width: 460px) { .wordmark .tag { display: none; } }

#search-wrap { position: relative; margin-left: auto; width: 44%; max-width: 190px; }
#search-input {
  width: 100%; padding: 7px 11px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--ink-2); color: var(--text);

}

#search-input:focus { border-color: var(--accent); }

#search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px;
  max-height: 280px; overflow-y: auto; display: none; z-index: 20;
  box-shadow: 0 12px 32px rgba(0,0,0,0.55);
}
#search-results.open { display: block; }
.search-item {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 11px; font-size: 13px;
  border-bottom: 1px solid var(--ink-3);
}
.search-item:last-child { border-bottom: none; }
.search-item:active { background: var(--ink-3); }
.search-item .code { font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
.search-item small { color: var(--muted); margin-left: auto; font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

/* ---------- Scène 3D ---------- */
#viewer { flex: 1; position: relative; touch-action: none; }
#viewer-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

}

.viewer-controls {

}
.viewer-controls button {

  backdrop-filter: blur(6px);

.viewer-controls button:active { background: var(--ink-3); border-color: var(--accent); }

/* ===== js/vec3.js ===== */
// Petites fonctions vectorielles 3D (tableaux [x,y,z]) — aucune dépendance externe.
const V3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0],
  ],
  length: (a) => Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]),
  normalize: (a) => {
    const len = V3.length(a);
    if (len < 1e-8) return [0, 0, 0];
    return [a[0] / len, a[1] / len, a[2] / len];
  },
};

if (typeof module !== 'undefined') module.exports = { V3 };

// Description géométrique d'un corps humain stylisé (chaînes de sphères)
// et des organes internes simplifiés, à partir des données de data.js.

function chain(from, to, radiusFrom, radiusTo, steps) {
  const spheres = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    spheres.push({
      pos: V3.lerp(from, to, t),
      radius: radiusFrom + (radiusTo - radiusFrom) * t,
    });
  }
  return spheres;
}

function buildBodyGeometry() {
  const skin = { color: '#e8c9a8', alpha: 0.9 };
  const parts = [];

  // Tête
  parts.push({ pos: [0, 1.685, 0], radius: 0.115 });
  parts.push({ pos: [0, 1.735, 0], radius: 0.10 });
  parts.push({ pos: [0, 1.63, 0], radius: 0.10 });

  // Cou
  parts.push(...chain([0, 1.47, 0], [0, 1.565, 0], 0.05, 0.045, 5));

  // Torse (épaules -> taille -> bassin)
  parts.push(...chain([0, 1.30, 0.01], [0, 1.47, 0], 0.145, 0.20, 10));
  parts.push(...chain([0, 1.05, 0.01], [0, 1.30, 0.01], 0.125, 0.145, 10));
  parts.push(...chain([0, 0.84, 0], [0, 1.05, 0.01], 0.15, 0.125, 8));

  // Bras
  [1, -1].forEach((side) => {
    const shoulder = [0.19 * side, 1.44, 0];
    const elbow = [0.235 * side, 1.13, 0.02];
    const wrist = [0.245 * side, 0.885, 0.02];
    const hand = [0.25 * side, 0.70, 0.02];
    const fingers = [0.252 * side, 0.66, 0.02];
    parts.push(...chain(shoulder, elbow, 0.05, 0.038, 7));
    parts.push(...chain(elbow, wrist, 0.036, 0.028, 6));
    parts.push(...chain(wrist, hand, 0.03, 0.024, 3));
    parts.push(...chain(hand, fingers, 0.022, 0.014, 2));
  });

  // Jambes
  [1, -1].forEach((side) => {
    const hip = [0.10 * side, 0.84, 0];
    const knee = [0.095 * side, 0.46, 0.02];
    const ankle = [0.075 * side, 0.09, 0.01];
    const foot = [0.075 * side, 0.02, 0.09];
    parts.push(...chain(hip, knee, 0.08, 0.055, 8));
    parts.push(...chain(knee, ankle, 0.052, 0.036, 7));
    parts.push(...chain(ankle, foot, 0.034, 0.03, 2));
  });

  return parts.map((p) => ({ ...p, color: skin.color, alpha: skin.alpha }));
}

function buildOrganGeometry(ORGAN_SHAPES) {
  const parts = [];
  Object.entries(ORGAN_SHAPES).forEach(([key, def]) => {
    def.parts.forEach((part) => {
      const avgScale = part.type === 'torus'
        ? part.scale[0]
        : (part.scale[0] + part.scale[1] + part.scale[2]) / 3;
      if (part.type === 'torus') {
        // approxime le tore par un anneau de petites sphères
        const n = 10;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          parts.push({
            pos: [
              part.pos[0] + Math.cos(a) * part.scale[0],
              part.pos[1],
              part.pos[2] + Math.sin(a) * part.scale[0],
            ],
            radius: part.scale[2],
            color: def.color,
            alpha: 0.5,
            organKey: key,
            wire: !!part.wire,
          });
        }
      } else {
        parts.push({
          pos: part.pos,
          radius: avgScale,
          color: def.color,
          alpha: part.wire ? 0.22 : 0.55,
          organKey: key,
          wire: !!part.wire,
        });
      }
    });
  });
  return parts;
}

if (typeof module !== 'undefined') module.exports = { buildBodyGeometry, buildOrganGeometry };

// Moteur de rendu 3D minimaliste en Canvas 2D : projection perspective manuelle,
// tri peintre (painter's algorithm) et contrôles orbitaux tactiles/souris.
// Aucune dépendance externe — conçu pour tourner offline sur iPhone (Safari/PWA).

function createEngine(canvas) {
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(width * dpr));
    canvas.height = Math.max(1, Math.round(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const camera = {
    target: [0, 1.05, 0],
    radius: 3.0,
    theta: 0.25, // azimut (rad)
    phi: 1.42,   // élévation depuis l'axe Y (rad), ~PI/2 = niveau des yeux
    fov: 40 * Math.PI / 180,
    minRadius: 0.55,
    maxRadius: 5.5,
    // Surface masquée par la fiche de détail (en pixels). La scène est cadrée
    // dans la zone réellement visible, jamais sous le panneau.
    occludedBottom: 0,
    occludedRight: 0,
  };

  function clampPhi(p) { return Math.max(0.12, Math.min(Math.PI - 0.12, p)); }
  function clampRadius(r) { return Math.max(camera.minRadius, Math.min(camera.maxRadius, r)); }

  function getCameraPosition() {
    const { target, radius, theta, phi } = camera;
    return [
      target[0] + radius * Math.sin(phi) * Math.sin(theta),
      target[1] + radius * Math.cos(phi),
      target[2] + radius * Math.sin(phi) * Math.cos(theta),
    ];
  }

  function getBasis() {
    const camPos = getCameraPosition();
    let z = V3.normalize(V3.sub(camPos, camera.target));
    if (V3.length(z) < 1e-6) z = [0, 0, 1];
    let x = V3.normalize(V3.cross([0, 1, 0], z));
    if (!isFinite(x[0]) || V3.length(x) < 1e-6) x = [1, 0, 0];
    const y = V3.cross(z, x);
    return { camPos, x, y, z };
  }

  // Projette un point monde -> {x, y (pixels CSS), dist (profondeur caméra), scale (px/mètre)}
  function project(pos, basis) {
    const rel = V3.sub(pos, basis.camPos);
    const camX = V3.dot(rel, basis.x);
    const camY = V3.dot(rel, basis.y);
    const camZ = V3.dot(rel, basis.z);
    const dist = -camZ;
    if (dist <= 0.02) return null;
    // Cadrage sur la zone visible (ce que la fiche ne recouvre pas)
    const usableH = Math.max(160, height - camera.occludedBottom);
    const usableW = Math.max(160, width - camera.occludedRight);
    const f = (usableH / 2) / Math.tan(camera.fov / 2);
    const scale = f / dist;
    return {
      x: usableW / 2 + camX * scale,
      y: usableH / 2 - camY * scale,
      dist,
      scale,
    };
  }

  // ---- Contrôles orbitaux (souris + tactile, y compris pincement) ----
  let dragging = false;
  let lastX = 0, lastY = 0;
  let pinchStartDist = 0;
  let pinchStartRadius = 0;
  const activePointers = new Map();

  function pointerDistance() {
    const pts = Array.from(activePointers.values());
    if (pts.length < 2) return 0;
    const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  canvas.style.touchAction = 'none';

  canvas.addEventListener('pointerdown', (e) => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    if (activePointers.size === 1) {
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
    } else if (activePointers.size === 2) {
      dragging = false;
      pinchStartDist = pointerDistance();
      pinchStartRadius = camera.radius;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size >= 2) {
      const d = pointerDistance();
      if (pinchStartDist > 10 && d > 10) {
        camera.radius = clampRadius(pinchStartRadius * (pinchStartDist / d));
      }
      return;
    }
    if (dragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      camera.theta -= dx * 0.008;
      camera.phi = clampPhi(camera.phi - dy * 0.008);
    }
  });

  function endPointer(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) { pinchStartDist = 0; }
    if (activePointers.size === 0) { dragging = false; }
    else if (activePointers.size === 1) {
      const pt = Array.from(activePointers.values())[0];
      dragging = true; lastX = pt.x; lastY = pt.y;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', (e) => { if (activePointers.has(e.pointerId)) endPointer(e); });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.radius = clampRadius(camera.radius * (1 + e.deltaY * 0.001));
  }, { passive: false });

  return {
    ctx, camera,
    get width() { return width; },
    get height() { return height; },
    getCameraPosition, getBasis, project,
    isDragBusy: () => dragging || activePointers.size > 1,
  };
}

if (typeof module !== 'undefined') module.exports = { createEngine };


/* ===== js/app.js ===== */
(function () {
  'use strict';

  const canvas = document.getElementById('viewer-canvas');
  const infoPanel = document.getElementById('info-panel');
  const infoTitle = document.getElementById('info-title');
  const infoSub = document.getElementById('info-sub');
  const infoBody = document.getElementById('info-body');
  const infoClose = document.getElementById('info-close');
  const legendList = document.getElementById('legend-list');
  const btnFront = document.getElementById('btn-front');
  const btnBack = document.getElementById('btn-back');
  const btnReset = document.getElementById('btn-reset');
  const btnAll = document.getElementById('btn-all');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const loadingEl = document.getElementById('loading');
  const hintEl = document.getElementById('hint');

  const DISCLAIMER = "Positions indicatives et simplifiées, à but pédagogique. Ne remplace pas un avis médical ni la formation d'un praticien.";

  function setAccent(color) {
    document.documentElement.style.setProperty('--accent', color || '#d9c3a5');
  }

  // La fiche de détail recouvre le bas de l'écran (ou la droite sur grand écran).
  // On recadre la scène sur la surface qui reste visible.
  let occludedTarget = { bottom: 0, right: 0 };
  function updateSceneShift(panelOpen) {
    if (!panelOpen) { occludedTarget = { bottom: 0, right: 0 }; return; }
    const isSidePanel = window.innerWidth >= 760;
    if (isSidePanel) {
      occludedTarget = { bottom: 0, right: Math.min(infoPanel.offsetWidth, engine.width * 0.5) };
    } else {
      occludedTarget = { bottom: Math.min(infoPanel.offsetHeight, engine.height * 0.62), right: 0 };
    }
  }
  function dismissHint() {
    if (hintEl) hintEl.classList.add('hidden');
  }

  const engine = createEngine(canvas);

  // ---- Géométrie statique du corps et des organes ----
  const bodyParts = buildBodyGeometry();
  const organParts = buildOrganGeometry(ORGAN_SHAPES);

  // ---- Méridiens : segments de ligne + points d'acupression ----
  const meridianSegments = []; // { a, b, color, meridianId }
  const acupoints = []; // { pos, meridian, point, side, color, screen:{x,y,dist} }

  function mirrorX(pos) { return [-pos[0], pos[1], pos[2]]; }

  MERIDIANS.forEach((meridian) => {
    const sides = meridian.bilateral ? ['R', 'L'] : ['C'];
    sides.forEach((side) => {
      const positions = meridian.points.map((p) => (side === 'L' ? mirrorX(p.pos) : p.pos));
      for (let i = 0; i < positions.length - 1; i++) {
        meridianSegments.push({ a: positions[i], b: positions[i + 1], color: meridian.color, meridianId: meridian.id });
      }
      meridian.points.forEach((point, idx) => {
        acupoints.push({
          pos: positions[idx],
          meridian, point, side,
          color: meridian.color,
          screen: null,
        });
      });
    });
  });

  // ---- État de sélection ----
  let selectedMeridianId = null;
  let selectedAcupoint = null;

  function isMeridianActive(id) { return !selectedMeridianId || selectedMeridianId === id; }
  function isOrganActive(key) {
    if (!selectedMeridianId) return null; // null = état neutre
    const m = MERIDIANS.find((mm) => mm.id === selectedMeridianId);
    return m && m.organKey === key;
  }

  // ---- UI : légende des méridiens ----
  function buildLegend() {
    legendList.innerHTML = '';
    MERIDIANS.forEach((m) => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.style.setProperty('--chip-color', m.color);
      chip.innerHTML = `<span class="dot" style="background:${m.color}"></span><span class="code">${m.id}</span>${m.name}`;
      chip.addEventListener('click', () => toggleMeridian(m.id));
      legendList.appendChild(chip);
    });
  }
  buildLegend();

  function highlightChip(id) {
    Array.from(legendList.children).forEach((chip, i) => {
      chip.classList.toggle('active', MERIDIANS[i].id === id);
    });
  }

  function toggleMeridian(id) {
    dismissHint();
    if (selectedMeridianId === id) {
      selectedMeridianId = null;
      highlightChip(null);
      setAccent(null);
      hideInfoPanel();
    } else {
      selectedMeridianId = id;
      selectedAcupoint = null;
      highlightChip(id);
      showMeridianInfo(MERIDIANS.find((m) => m.id === id));
    }
  }

  function showMeridianInfo(meridian) {
    setAccent(meridian.color);
    infoPanel.classList.add('open');
    infoTitle.innerHTML = `<span class="code">${meridian.id}</span>${meridian.name}`;
    infoSub.textContent = `${meridian.namePinyin} · ${meridian.yinYang}`;
    infoBody.innerHTML = `
      <div class="meta-row">
        <span class="meta"><span class="k">Élément</span><span class="v">${meridian.element}</span></span>
        <span class="meta"><span class="k">Organe</span><span class="v">${meridian.organ}</span></span>
        <span class="meta"><span class="k">Points</span><span class="v">${meridian.points.length}</span></span>
      </div>
      <p>${meridian.description}</p>
      <div class="section-label">Points du canal</div>
      <div class="point-list">
        ${meridian.points.map((p) => `<button class="point-chip" data-point="${p.id}"><span class="code">${p.id}</span>${p.name}</button>`).join('')}
      </div>
      <p class="disclaimer">${DISCLAIMER}</p>
    `;
    infoBody.querySelectorAll('.point-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        const p = meridian.points.find((pt) => pt.id === btn.dataset.point);
        showPointInfo(meridian, p, 'R');
        focusOnPosition(p.pos);
      });
    });
    requestAnimationFrame(() => updateSceneShift(true));
  }

  function showPointInfo(meridian, point, side) {
    dismissHint();
    setAccent(meridian.color);
    selectedAcupoint = { meridian, point, side };
    infoPanel.classList.add('open');
    infoTitle.innerHTML = `<span class="code">${point.id}</span>${point.name}`;
    infoSub.textContent = `« ${point.trad} »`;
    const sideLabel = side === 'L' ? 'Côté gauche' : side === 'R' ? 'Côté droit' : 'Ligne médiane';
    infoBody.innerHTML = `
      <div class="meta-row">
        <span class="meta"><span class="k">Canal</span><span class="v">${meridian.name}</span></span>
        <span class="meta"><span class="k">Organe</span><span class="v">${meridian.organ}</span></span>
        <span class="meta"><span class="k">Côté</span><span class="v">${sideLabel}</span></span>
      </div>
      <div class="section-label">Indications principales</div>
      <p>${point.info}</p>
      <div class="section-label">Autres points du canal ${meridian.id}</div>
      <div class="point-list">
        ${meridian.points.filter((p) => p.id !== point.id).map((p) => `<button class="point-chip" data-point="${p.id}"><span class="code">${p.id}</span>${p.name}</button>`).join('')}
      </div>
      <p class="disclaimer">${DISCLAIMER}</p>
    `;
    infoBody.querySelectorAll('.point-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        const p = meridian.points.find((pt) => pt.id === btn.dataset.point);
        showPointInfo(meridian, p, side);
        focusOnPosition(p.pos);
      });
    });
    requestAnimationFrame(() => updateSceneShift(true));
  }

  function hideInfoPanel() {
    infoPanel.classList.remove('open');
    selectedAcupoint = null;
    updateSceneShift(false);
  }

  infoClose.addEventListener('click', () => {
    hideInfoPanel();
    selectedMeridianId = null;
    highlightChip(null);
    setAccent(null);
  });

  btnAll.addEventListener('click', () => {
    selectedMeridianId = null;
    highlightChip(null);
    setAccent(null);
    hideInfoPanel();
  });

  function focusOnPosition(pos) {
    engine.camera.target = [0, pos[1], 0];
  }

  function setView(theta) {
    engine.camera.theta = theta;
    engine.camera.phi = 1.42;
  }
  btnFront.addEventListener('click', () => setView(0));
  btnBack.addEventListener('click', () => setView(Math.PI));
  btnReset.addEventListener('click', () => {
    engine.camera.target = [0, 1.05, 0];
    engine.camera.radius = 2.6;
    engine.camera.theta = 0.25;
    engine.camera.phi = 1.42;
    selectedMeridianId = null;
    highlightChip(null);
    setAccent(null);
    hideInfoPanel();
  });

  // ---- Recherche ----
  const allPointsFlat = [];
  MERIDIANS.forEach((m) => m.points.forEach((p) => allPointsFlat.push({ meridian: m, point: p })));

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!q) { searchResults.classList.remove('open'); return; }
    const matches = allPointsFlat.filter(({ point }) =>
      point.id.toLowerCase().includes(q) || point.name.toLowerCase().includes(q) || point.trad.toLowerCase().includes(q)
    ).slice(0, 12);
    if (matches.length === 0) { searchResults.classList.remove('open'); return; }
    searchResults.classList.add('open');
    matches.forEach(({ meridian, point }) => {
      const item = document.createElement('div');
      item.className = 'search-item';
      item.innerHTML = `<span class="dot" style="background:${meridian.color}"></span><span class="code">${point.id}</span> ${point.name} <small>${meridian.name}</small>`;
      item.addEventListener('click', () => {
        selectedMeridianId = meridian.id;
        highlightChip(meridian.id);
        showPointInfo(meridian, point, 'R');
        focusOnPosition(point.pos);
        searchResults.classList.remove('open');
        searchInput.value = '';
        searchInput.blur();
      });
      searchResults.appendChild(item);
    });
  });

  // ---- Tap / clic : sélection d'un point d'acupression ----
  let pointerDownInfo = null;
  canvas.addEventListener('pointerdown', (e) => {
    pointerDownInfo = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  canvas.addEventListener('pointerup', (e) => {
    if (!pointerDownInfo) return;
    const dx = e.clientX - pointerDownInfo.x;
    const dy = e.clientY - pointerDownInfo.y;
    const moved = Math.sqrt(dx * dx + dy * dy);
    const dt = Date.now() - pointerDownInfo.t;
    pointerDownInfo = null;
    if (moved > 8 || dt > 500) return; // c'était un glissé, pas un tap

    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const hitRadius = 20;
    let best = null;
    let bestDist = Infinity;
    acupoints.forEach((ap) => {
      if (!ap.screen) return;
      const ddx = ap.screen.x - px;
      const ddy = ap.screen.y - py;
      const d2 = ddx * ddx + ddy * ddy;
      if (d2 <= hitRadius * hitRadius && ap.screen.dist < bestDist) {
        bestDist = ap.screen.dist;
        best = ap;
      }
    });
    if (best) {
      selectedMeridianId = best.meridian.id;
      highlightChip(best.meridian.id);
      showPointInfo(best.meridian, best.point, best.side);
    } else {
      dismissHint();
    }
  });

  // ---- Boucle de rendu ----
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const colorCache = new Map();
  function rgba(hex, alpha) {
    let rgb = colorCache.get(hex);
    if (!rgb) { rgb = hexToRgb(hex); colorCache.set(hex, rgb); }
    return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
  }

  function render() {
    const ctx = engine.ctx;
    engine.camera.occludedBottom += (occludedTarget.bottom - engine.camera.occludedBottom) * 0.16;
    engine.camera.occludedRight += (occludedTarget.right - engine.camera.occludedRight) * 0.16;
    const basis = engine.getBasis();
    const w = engine.width, h = engine.height;
    ctx.clearRect(0, 0, w, h);

    // Fond dégradé
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#101c30');
    grad.addColorStop(1, '#070c17');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const drawList = [];

    // Sol (cercle au niveau des pieds)
    const groundPts = [];
    const groundN = 40;
    for (let i = 0; i < groundN; i++) {
      const a = (i / groundN) * Math.PI * 2;
      const p = engine.project([Math.cos(a) * 0.9, 0, Math.sin(a) * 0.9], basis);
      if (p) groundPts.push(p);
    }
    if (groundPts.length === groundN) {
      const avgDist = groundPts.reduce((s, p) => s + p.dist, 0) / groundN;
      drawList.push({
        dist: avgDist + 3,
        draw: () => {
          ctx.beginPath();
          groundPts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
          ctx.closePath();
          ctx.fillStyle = 'rgba(30,50,80,0.35)';
          ctx.fill();
        },
      });
    }

    // Corps (chaîne de sphères légèrement gonflées + ombrage radial pour lisser les jointures)
    bodyParts.forEach((part) => {
      const p = engine.project(part.pos, basis);
      if (!p) return;
      const r = Math.max(0.6, part.radius * p.scale * 1.28);
      drawList.push({
        dist: p.dist,
        draw: () => {
          const lightX = p.x - r * 0.35, lightY = p.y - r * 0.4;
          const grad = ctx.createRadialGradient(lightX, lightY, r * 0.1, p.x, p.y, r * 1.05);
          grad.addColorStop(0, rgba('#f3ddc2', 0.95));
          grad.addColorStop(0.6, rgba(part.color, 0.92));
          grad.addColorStop(1, rgba('#c9a684', 0.85));
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        },
      });
    });

    // Organes (discrets par défaut, mis en évidence quand leur méridien est sélectionné)
    organParts.forEach((part) => {
      const active = isOrganActive(part.organKey);
      if (active === false) return; // masqué si un autre méridien est sélectionné
      const p = engine.project(part.pos, basis);
      if (!p) return;
      const r = Math.max(0.5, part.radius * p.scale);
      const alpha = active ? Math.min(part.alpha + 0.4, 0.9) : part.alpha * 0.15;
      drawList.push({
        dist: p.dist - 0.001, // légèrement devant la peau au même point
        draw: () => {
          if (active) { ctx.save(); ctx.shadowColor = part.color; ctx.shadowBlur = 14; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = rgba(part.color, alpha);
          ctx.fill();
          if (active) {
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = rgba(part.color, 0.9);
            ctx.stroke();
            ctx.restore();
          }
        },
      });
    });

    // Segments de méridiens
    meridianSegments.forEach((seg) => {
      const isSelectedOne = selectedMeridianId === seg.meridianId;
      const neutral = !selectedMeridianId;
      const opacity = isSelectedOne ? 0.95 : neutral ? 0.4 : 0.06;
      const width = isSelectedOne ? 2.6 : neutral ? 1.3 : 1;
      const pa = engine.project(seg.a, basis);
      const pb = engine.project(seg.b, basis);
      if (!pa || !pb) return;
      const dist = (pa.dist + pb.dist) / 2;
      drawList.push({
        dist,
        draw: () => {
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.strokeStyle = rgba(seg.color, opacity);
          ctx.lineWidth = width;
          ctx.stroke();
        },
      });
    });

    // Points d'acupression
    const t = performance.now() * 0.002;
    acupoints.forEach((ap) => {
      const p = engine.project(ap.pos, basis);
      ap.screen = p;
      if (!p) return;
      const active = isMeridianActive(ap.meridian.id);
      const isSelected = selectedAcupoint && selectedAcupoint.point.id === ap.point.id && selectedAcupoint.side === ap.side;
      const baseR = Math.max(active ? 4.5 : 1.8, 0.012 * p.scale * (active ? 1 : 0.5));
      const pulse = active ? (0.5 + Math.sin(t * 2.2 + ap.pos[1] * 5) * 0.15) : 0;
      const opacity = active ? Math.min(1, 0.5 + pulse) : 0.22;
      drawList.push({
        dist: p.dist - 0.002,
        draw: () => {
          if (active) {
            ctx.save();
            ctx.shadowColor = ap.color;
            ctx.shadowBlur = isSelected ? 16 : 8;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, isSelected ? baseR * 1.6 : baseR, 0, Math.PI * 2);
          ctx.fillStyle = rgba(ap.color, opacity);
          ctx.fill();
          if (isSelected) {
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
          }
          if (active) ctx.restore();
        },
      });
    });

    drawList.sort((a, b) => b.dist - a.dist);
    drawList.forEach((item) => item.draw());

    requestAnimationFrame(render);
  }

  window.addEventListener('resize', () => updateSceneShift(infoPanel.classList.contains('open')));

  if (loadingEl) loadingEl.remove();
  requestAnimationFrame(render);
})();

</script>
