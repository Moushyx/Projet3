/* Corps & Méridiens 3D — feuille de style
   Univers visuel unique et assumé : planche anatomique nocturne.
   Toutes les couleurs sont peintes explicitement (pas de thème clair). */

:root {
  --ink: #0b1220;
  --ink-2: #101b2e;
  --ink-3: #17253c;
  --line: #24354f;
  --text: #edf2f9;
  --muted: #8fa1bd;
  --skin: #e8c9a8;
  --accent: #d9c3a5; /* prend la couleur du canal sélectionné */

  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- Barre supérieure ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px;
  background: var(--ink);
  border-bottom: 1px solid var(--line);
  z-index: 5;
}
.wordmark { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.wordmark h1 {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  margin: 0; white-space: nowrap;
}
.wordmark .tag {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500; letter-spacing: 0.14em;
  color: var(--muted); text-transform: uppercase; white-space: nowrap;
}

@media (max-width: 460px) { .wordmark .tag { display: none; } }

#search-wrap { position: relative; margin-left: auto; width: 44%; max-width: 190px; }
#search-input {
  width: 100%; padding: 7px 11px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--ink-2); color: var(--text);

}

#search-input:focus { border-color: var(--accent); }

#search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px;
  max-height: 280px; overflow-y: auto; display: none; z-index: 20;
  box-shadow: 0 12px 32px rgba(0,0,0,0.55);
}
#search-results.open { display: block; }
.search-item {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 11px; font-size: 13px;
  border-bottom: 1px solid var(--ink-3);
}
.search-item:last-child { border-bottom: none; }
.search-item:active { background: var(--ink-3); }
.search-item .code { font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
.search-item small { color: var(--muted); margin-left: auto; font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

/* ---------- Scène 3D ---------- */
#viewer { flex: 1; position: relative; touch-action: none; }
#viewer-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

}

.viewer-controls {

}
.viewer-controls button {

.viewer-controls button:active { background: var(--ink-3); border-color: var(--accent); }

/* ===== js/vec3.js ===== */
// Petites fonctions vectorielles 3D (tableaux [x,y,z]) — aucune dépendance externe.
const V3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0],
  ],
  length: (a) => Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]),
  normalize: (a) => {
    const len = V3.length(a);
    if (len < 1e-8) return [0, 0, 0];
    return [a[0] / len, a[1] / len, a[2] / len];
  },
};

if (typeof module !== 'undefined') module.exports = { V3 };

// Organes internes simplifiés, positionnés à partir des données de data.js.
// (Le corps lui-même est un maillage anatomique construit dans mesh.js.)

function buildOrganGeometry(ORGAN_SHAPES) {
  const parts = [];
  Object.entries(ORGAN_SHAPES).forEach(([key, def]) => {
    def.parts.forEach((part) => {
      const avgScale = part.type === 'torus'
        ? part.scale[0]
        : (part.scale[0] + part.scale[1] + part.scale[2]) / 3;
      if (part.type === 'torus') {
        // approxime le tore par un anneau de petites sphères
        const n = 10;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          parts.push({
            pos: [
              part.pos[0] + Math.cos(a) * part.scale[0],
              part.pos[1],
              part.pos[2] + Math.sin(a) * part.scale[0],
            ],
            radius: part.scale[2],
            color: def.color,
            alpha: 0.5,
            organKey: key,
            wire: !!part.wire,
          });
        }
      } else {
        parts.push({
          pos: part.pos,
          radius: avgScale,
          color: def.color,
          alpha: part.wire ? 0.22 : 0.55,
          organKey: key,
          wire: !!part.wire,
        });
      }
    });
  });
  return parts;
}

if (typeof module !== 'undefined') module.exports = { buildOrganGeometry };


/* ===== js/mesh.js ===== */
// Maillage anatomique du corps humain.
//
// Chaque partie du corps est engendrée par « lofting » : une suite de sections
// transversales (des super-ellipses, plus proches d'une coupe humaine qu'un
// cercle) est enfilée le long d'un axe, puis reliée par des quadrilatères.
// La surface obtenue est continue — plus de chaînes de sphères ni de coutures.
//
// L'éclairage est calculé une fois pour toutes à la construction : les lumières
// sont fixes dans le monde et seule la caméra tourne, donc la couleur de chaque
// facette ne change jamais. Le rendu par image se limite à projeter les sommets
// et à remplir les facettes, ce qui reste fluide sur téléphone.

const SKIN_BASE = [226, 178, 146];
const SKIN_SHADOW = [74, 52, 58];
const LIGHT_KEY = { dir: [-0.44, 0.70, 0.62], intensity: 0.62, tint: [255, 246, 232] };
const LIGHT_FILL = { dir: [0.78, 0.12, -0.42], intensity: 0.30, tint: [150, 180, 225] };
const AMBIENT = 0.34;
// Éclairage « enveloppant » : la lumière déborde du terminateur, comme sur une
// peau. Les écarts entre facettes voisines s'atténuent nettement.
const WRAP = 0.35;

function buildHumanMesh() {
  const positions = [];
  const faces = [];
  // Le tri du peintre ne sait pas départager deux surfaces qui se traversent.
  // On regroupe donc les facettes par partie du corps : les parties sont
  // ordonnées entre elles, et les facettes seulement à l'intérieur d'une partie.
  const parts = [];
  let currentPart = -1;

  function beginPart() {
    parts.push({ sum: [0, 0, 0], count: 0, centroid: [0, 0, 0] });
    currentPart = parts.length - 1;
  }

  function addVertex(p) {
    positions.push(p[0], p[1], p[2]);
    return positions.length / 3 - 1;
  }

  // Repère perpendiculaire à l'axe : U suit la largeur (X), V la profondeur (Z).
  function frameFor(tangent) {
    const t = V3.normalize(tangent);
    const ref = Math.abs(t[1]) > 0.9 ? [0, 0, 1] : [0, 1, 0];
    let u = V3.normalize(V3.cross(ref, t));
    if (V3.length(u) < 1e-6) u = [1, 0, 0];
    if (u[0] < 0) u = V3.scale(u, -1); // U pointe toujours vers la droite
    const v = V3.normalize(V3.cross(t, u));
    return { u, v };
  }

  // Section transversale : super-ellipse d'exposant `exp`
  // (exp = 2 → ellipse ; exp > 2 → ovale aplati, comme un torse).
  function ringVertices(center, frame, rx, rz, exp, segments) {
    const idx = [];
    const p = 2 / exp;
    for (let s = 0; s < segments; s++) {
      const a = (s / segments) * Math.PI * 2;
      const c = Math.cos(a), si = Math.sin(a);
      const dx = Math.sign(c) * Math.pow(Math.abs(c), p) * rx;
      const dz = Math.sign(si) * Math.pow(Math.abs(si), p) * rz;
      idx.push(addVertex([
        center[0] + frame.u[0] * dx + frame.v[0] * dz,
        center[1] + frame.u[1] * dx + frame.v[1] * dz,
        center[2] + frame.u[2] * dx + frame.v[2] * dz,
      ]));
    }
    return idx;
  }

  function vertexAt(i) {
    return [positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]];
  }

  function addQuad(a, b, c, d, forcedNormal) {
    const pa = vertexAt(a), pb = vertexAt(b), pc = vertexAt(c), pd = vertexAt(d);
    const normal = forcedNormal || V3.normalize(V3.cross(V3.sub(pb, pa), V3.sub(pd, pa)));
    const center = [
      (pa[0] + pb[0] + pc[0] + pd[0]) / 4,
      (pa[1] + pb[1] + pc[1] + pd[1]) / 4,
      (pa[2] + pb[2] + pc[2] + pd[2]) / 4,
    ];
    faces.push({ a, b, c, d, n: normal, center, color: shade(normal, center), part: currentPart });
    const acc = parts[currentPart];
    acc.sum[0] += center[0]; acc.sum[1] += center[1]; acc.sum[2] += center[2];
    acc.count++;
  }

  // Couleur figée d'une facette : lumière principale chaude, lumière
  // d'appoint froide, plus un assombrissement des surfaces tournées vers le sol.
  function shade(n, center) {
    const key = Math.max(0, (V3.dot(n, V3.normalize(LIGHT_KEY.dir)) + WRAP) / (1 + WRAP));
    const fill = Math.max(0, (V3.dot(n, V3.normalize(LIGHT_FILL.dir)) + WRAP) / (1 + WRAP));
    const upward = (n[1] + 1) / 2; // 0 = vers le sol, 1 = vers le ciel
    const occlusion = 0.84 + 0.16 * upward;
    const lambert = (AMBIENT + LIGHT_KEY.intensity * key) * occlusion;

    const out = [0, 0, 1].map((_, i) => {
      const base = SKIN_BASE[i] * lambert + SKIN_SHADOW[i] * (1 - Math.min(1, lambert)) * 0.5;
      const keyTint = (LIGHT_KEY.tint[i] / 255) * key * 26;
      const fillTint = (LIGHT_FILL.tint[i] / 255) * fill * LIGHT_FILL.intensity * 90;
      return Math.max(0, Math.min(255, Math.round(base + keyTint + fillTint)));
    });
    return `rgb(${out[0]},${out[1]},${out[2]})`;
  }

  // Enfile une suite de sections le long d'un axe.
  // spine : [{ p:[x,y,z], rx, rz, exp? }, ...]
  function addTube(spine, segments, options) {
    const opts = options || {};
    if (!opts.samePart) beginPart();
    const rings = [];
    for (let i = 0; i < spine.length; i++) {
      const prev = spine[Math.max(0, i - 1)].p;
      const next = spine[Math.min(spine.length - 1, i + 1)].p;
      const frame = frameFor(V3.sub(next, prev));
      rings.push(ringVertices(spine[i].p, frame, spine[i].rx, spine[i].rz, spine[i].exp || 2, segments));
    }
    for (let i = 0; i < rings.length - 1; i++) {
      for (let s = 0; s < segments; s++) {
        const s2 = (s + 1) % segments;
        addQuad(rings[i][s], rings[i][s2], rings[i + 1][s2], rings[i + 1][s]);
      }
    }
    return rings;
  }

  // Ellipsoïde (tête, épaules, masses articulaires, nez, oreilles).
  function addEllipsoid(center, scale, segments, ringCount, squash) {
    const spine = [];
    for (let i = 0; i <= ringCount; i++) {
      const t = i / ringCount;
      const phi = t * Math.PI;
      const y = Math.cos(phi);
      const r = Math.sin(phi);
      spine.push({
        p: [center[0], center[1] + y * scale[1], center[2] + (squash ? squash(t) : 0)],
        rx: Math.max(0.0015, r * scale[0]),
        rz: Math.max(0.0015, r * scale[2]),
        exp: 2,
      });
    }
    addTube(spine, segments);

  // Ferme une extrémité par un dôme : on prolonge l'axe de quelques sections
  // dont le rayon décroît en quart de cercle. Contrairement à un bouchon plat,
  // un dôme ne peut jamais apparaître comme une plaque au milieu de la peau.
  function domeEnds(spine, opts) {
    const o = opts || {};
    const steps = o.steps || 3;
    let out = spine.slice();
    const build = (ref, dir) => {
      const depth = Math.min(ref.rx, ref.rz) * (o.depth || 1);
      const rings = [];
      for (let k = steps; k >= 1; k--) {
        const t = (k / (steps + 1)) * (Math.PI / 2);
        rings.push({
          p: V3.add(ref.p, V3.scale(dir, depth * Math.sin(t))),
          rx: Math.max(0.002, ref.rx * Math.cos(t)),
          rz: Math.max(0.002, ref.rz * Math.cos(t)),
          exp: ref.exp || 2,
        });
      }
      return rings;
    };
    if (o.start !== false) {
      out = build(out[0], V3.normalize(V3.sub(out[0].p, out[1].p))).concat(out);
    }
    if (o.end !== false) {
      const n = out.length;
      out = out.concat(build(out[n - 1], V3.normalize(V3.sub(out[n - 1].p, out[n - 2].p))).reverse());
    }
    return out;
  }

  // Densifie une suite de sections (interpolation de Catmull-Rom) : la surface
  // gagne en douceur sans qu'il faille saisir chaque section à la main.
  function refine(spine, factor) {
    if (factor <= 1 || spine.length < 2) return spine;
    const val = (arr, i) => arr[Math.max(0, Math.min(arr.length - 1, i))];
    const cr = (p0, p1, p2, p3, t) => {
      const t2 = t * t, t3 = t2 * t;
      return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
    };
    const out = [];
    for (let i = 0; i < spine.length - 1; i++) {
      for (let k = 0; k < factor; k++) {
        const t = k / factor;
        const a = val(spine, i - 1), b = spine[i], c = spine[i + 1], d = val(spine, i + 2);
        out.push({
          p: [0, 1, 2].map((axis) => cr(a.p[axis], b.p[axis], c.p[axis], d.p[axis], t)),
          rx: Math.max(0.002, cr(a.rx, b.rx, c.rx, d.rx, t)),
          rz: Math.max(0.002, cr(a.rz, b.rz, c.rz, d.rz, t)),
          exp: b.exp || 2,
        });
      }
    }
    out.push(spine[spine.length - 1]);
    return out;
  }

  // enterrée dans la masse voisine, sinon elle apparaîtrait comme une plaque.

  // ---------------------------------------------------------------
  // Tête : crâne, pommettes, mâchoire qui s'affine, menton avancé.
  // La base descend dans le cou.
  // ---------------------------------------------------------------
  addTube(domeEnds(refine([
    { p: [0, 1.752, -0.005], rx: 0.055, rz: 0.062 },
    { p: [0, 1.738, -0.007], rx: 0.070, rz: 0.079 },
    { p: [0, 1.722, -0.009], rx: 0.083, rz: 0.093 },
    { p: [0, 1.694, -0.008], rx: 0.090, rz: 0.101, exp: 2.15 },
    { p: [0, 1.666, -0.004], rx: 0.091, rz: 0.102, exp: 2.15 },
    { p: [0, 1.638, 0.001], rx: 0.086, rz: 0.097, exp: 2.15 },
    { p: [0, 1.612, 0.005], rx: 0.076, rz: 0.089, exp: 2.2 },
    { p: [0, 1.588, 0.009], rx: 0.061, rz: 0.077, exp: 2.2 },
    { p: [0, 1.568, 0.010], rx: 0.046, rz: 0.062, exp: 2.1 },
    { p: [0, 1.552, 0.004], rx: 0.038, rz: 0.046 },
    { p: [0, 1.538, 0.000], rx: 0.033, rz: 0.038 },
  ], 2), { depth: 0.55 }), 22);

  // Nez et oreilles : la silhouette se lit tout de suite comme une tête.
  addEllipsoid([0, 1.646, 0.095], [0.013, 0.022, 0.019], 10, 6);
  addEllipsoid([0.088, 1.656, -0.006], [0.010, 0.027, 0.017], 10, 6);
  addEllipsoid([-0.088, 1.656, -0.006], [0.010, 0.027, 0.017], 10, 6);

  // ---------------------------------------------------------------
  // Cou : plonge dans le tronc en bas, dans la tête en haut.
  // ---------------------------------------------------------------
  addTube(domeEnds(refine([
    { p: [0, 1.400, -0.004], rx: 0.070, rz: 0.066 },
    { p: [0, 1.455, -0.002], rx: 0.058, rz: 0.057 },
    { p: [0, 1.500, 0.000], rx: 0.050, rz: 0.052 },
    { p: [0, 1.540, 0.003], rx: 0.045, rz: 0.048 },
    { p: [0, 1.580, 0.006], rx: 0.041, rz: 0.044 },
  ], 2)), 20);

  // Torse : bassin, taille marquée, cage thoracique, puis pente des trapèzes
  // qui se termine à l'intérieur du cou.

    { p: [0, 0.868, 0.004], rx: 0.078, rz: 0.070, exp: 2.2 },
    { p: [0, 0.900, 0.004], rx: 0.138, rz: 0.101, exp: 2.5 },
    { p: [0, 0.945, 0.003], rx: 0.141, rz: 0.100, exp: 2.5 },

    { p: [0, 1.090, 0.003], rx: 0.114, rz: 0.094, exp: 2.45 },
    { p: [0, 1.145, 0.004], rx: 0.129, rz: 0.101, exp: 2.5 },
    { p: [0, 1.205, 0.004], rx: 0.143, rz: 0.106, exp: 2.55 },
    { p: [0, 1.265, 0.003], rx: 0.152, rz: 0.108, exp: 2.6 },
    { p: [0, 1.325, 0.001], rx: 0.157, rz: 0.105, exp: 2.6 },
    { p: [0, 1.380, -0.001], rx: 0.157, rz: 0.099, exp: 2.6 },
    { p: [0, 1.425, -0.003], rx: 0.146, rz: 0.092, exp: 2.5 },
    { p: [0, 1.462, -0.004], rx: 0.110, rz: 0.080, exp: 2.3 },
    { p: [0, 1.492, -0.002], rx: 0.062, rz: 0.058 },

  ], 2)), 28);

  // Épaules (deltoïdes) : referment la jonction bras / tronc.
  addEllipsoid([0.161, 1.378, -0.002], [0.062, 0.072, 0.062], 18, 11);
  addEllipsoid([-0.161, 1.378, -0.002], [0.062, 0.072, 0.062], 18, 11);

  addEllipsoid([0, 0.890, 0.002], [0.116, 0.090, 0.092], 20, 12);

  // exactement celui des données de points d'acupression.
  // ---------------------------------------------------------------

    addTube(domeEnds(refine([
      { p: [0.158 * side, 1.412, -0.002], rx: 0.044, rz: 0.046 },
      { p: [0.186 * side, 1.400, -0.001], rx: 0.051, rz: 0.053 },
      { p: [0.205 * side, 1.320, 0.001], rx: 0.048, rz: 0.050 },
      { p: [0.219 * side, 1.230, 0.003], rx: 0.044, rz: 0.046 },
      { p: [0.229 * side, 1.150, 0.005], rx: 0.038, rz: 0.041 },
      { p: [0.233 * side, 1.110, 0.007], rx: 0.037, rz: 0.040 }, // coude
      { p: [0.238 * side, 1.040, 0.009], rx: 0.040, rz: 0.042 },
      { p: [0.242 * side, 0.965, 0.011], rx: 0.035, rz: 0.037 },

      { p: [0.246 * side, 0.872, 0.015], rx: 0.024, rz: 0.026 }, // poignet

      { p: [0.251 * side, 0.676, 0.021], rx: 0.014, rz: 0.008 }, // doigts
    ], 2)), 18);
  });

  // ---------------------------------------------------------------
  // Jambes : le haut de la cuisse est enfoui dans le bassin.
  // ---------------------------------------------------------------
  [1, -1].forEach((side) => {
    addTube(domeEnds(refine([
      { p: [0.092 * side, 0.945, -0.002], rx: 0.078, rz: 0.081 },
      { p: [0.097 * side, 0.860, 0.002], rx: 0.086, rz: 0.089 },

      { p: [0.094 * side, 0.460, 0.016], rx: 0.052, rz: 0.055 }, // genou
      { p: [0.092 * side, 0.410, 0.014], rx: 0.051, rz: 0.057 },
      { p: [0.089 * side, 0.345, 0.010], rx: 0.053, rz: 0.060 }, // mollet
      { p: [0.086 * side, 0.270, 0.006], rx: 0.045, rz: 0.051 },

      { p: [0.075 * side, 0.075, 0.002], rx: 0.025, rz: 0.028 }, // cheville
    ], 2)), 20);

    // Pied : talon en arrière, masse qui s'aplatit vers les orteils.
    addTube(domeEnds(refine([
      { p: [0.075 * side, 0.052, -0.032], rx: 0.027, rz: 0.028 },
      { p: [0.075 * side, 0.030, 0.000], rx: 0.033, rz: 0.042 },

  parts.forEach((prt) => {
    if (prt.count > 0) {

/* ===== js/engine.js ===== */
// Moteur de rendu 3D minimaliste en Canvas 2D : projection perspective manuelle,
// tri peintre (painter's algorithm) et contrôles orbitaux tactiles/souris.
// Aucune dépendance externe — conçu pour tourner offline sur iPhone (Safari/PWA).

function createEngine(canvas) {
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(width * dpr));
    canvas.height = Math.max(1, Math.round(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const camera = {
    target: [0, 1.05, 0],
    radius: 3.0,
    theta: 0.25, // azimut (rad)
    phi: 1.42,   // élévation depuis l'axe Y (rad), ~PI/2 = niveau des yeux
    fov: 40 * Math.PI / 180,
    minRadius: 0.55,
    maxRadius: 5.5,
    // Surface masquée par la fiche de détail (en pixels). La scène est cadrée
    // dans la zone réellement visible, jamais sous le panneau.
    occludedBottom: 0,
    occludedRight: 0,
  };

  function clampPhi(p) { return Math.max(0.12, Math.min(Math.PI - 0.12, p)); }
  function clampRadius(r) { return Math.max(camera.minRadius, Math.min(camera.maxRadius, r)); }

  function getCameraPosition() {
    const { target, radius, theta, phi } = camera;
    return [
      target[0] + radius * Math.sin(phi) * Math.sin(theta),
      target[1] + radius * Math.cos(phi),
      target[2] + radius * Math.sin(phi) * Math.cos(theta),
    ];
  }

  function getBasis() {
    const camPos = getCameraPosition();
    let z = V3.normalize(V3.sub(camPos, camera.target));
    if (V3.length(z) < 1e-6) z = [0, 0, 1];
    let x = V3.normalize(V3.cross([0, 1, 0], z));
    if (!isFinite(x[0]) || V3.length(x) < 1e-6) x = [1, 0, 0];
    const y = V3.cross(z, x);
    return { camPos, x, y, z };
  }

  // Projette un point monde -> {x, y (pixels CSS), dist (profondeur caméra), scale (px/mètre)}
  function project(pos, basis) {
    const rel = V3.sub(pos, basis.camPos);
    const camX = V3.dot(rel, basis.x);
    const camY = V3.dot(rel, basis.y);
    const camZ = V3.dot(rel, basis.z);
    const dist = -camZ;
    if (dist <= 0.02) return null;
    // Cadrage sur la zone visible (ce que la fiche ne recouvre pas)
    const usableH = Math.max(160, height - camera.occludedBottom);
    const usableW = Math.max(160, width - camera.occludedRight);
    const f = (usableH / 2) / Math.tan(camera.fov / 2);
    const scale = f / dist;
    return {
      x: usableW / 2 + camX * scale,
      y: usableH / 2 - camY * scale,
      dist,
      scale,
    };
  }

  // ---- Contrôles orbitaux (souris + tactile, y compris pincement) ----
  let dragging = false;
  let lastX = 0, lastY = 0;
  let pinchStartDist = 0;
  let pinchStartRadius = 0;
  const activePointers = new Map();

  function pointerDistance() {
    const pts = Array.from(activePointers.values());
    if (pts.length < 2) return 0;
    const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  canvas.style.touchAction = 'none';

  canvas.addEventListener('pointerdown', (e) => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    if (activePointers.size === 1) {
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
    } else if (activePointers.size === 2) {
      dragging = false;
      pinchStartDist = pointerDistance();
      pinchStartRadius = camera.radius;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size >= 2) {
      const d = pointerDistance();
      if (pinchStartDist > 10 && d > 10) {
        camera.radius = clampRadius(pinchStartRadius * (pinchStartDist / d));
      }
      return;
    }
    if (dragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      camera.theta -= dx * 0.008;
      camera.phi = clampPhi(camera.phi - dy * 0.008);
    }
  });

  function endPointer(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) { pinchStartDist = 0; }
    if (activePointers.size === 0) { dragging = false; }
    else if (activePointers.size === 1) {
      const pt = Array.from(activePointers.values())[0];
      dragging = true; lastX = pt.x; lastY = pt.y;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', (e) => { if (activePointers.has(e.pointerId)) endPointer(e); });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.radius = clampRadius(camera.radius * (1 + e.deltaY * 0.001));
  }, { passive: false });

  return {
    ctx, camera,
    get width() { return width; },
    get height() { return height; },
    getCameraPosition, getBasis, project,
    isDragBusy: () => dragging || activePointers.size > 1,
  };
}

if (typeof module !== 'undefined') module.exports = { createEngine };

  const meridianSegments = []; // { a, b, color, meridianId }
  const acupoints = []; // { pos, meridian, point, side, color, screen:{x,y,dist} }

  function mirrorX(pos) { return [-pos[0], pos[1], pos[2]]; }

  MERIDIANS.forEach((meridian) => {
    const sides = meridian.bilateral ? ['R', 'L'] : ['C'];
    sides.forEach((side) => {
      const positions = meridian.points.map((p) => (side === 'L' ? mirrorX(p.pos) : p.pos));
      for (let i = 0; i < positions.length - 1; i++) {
        meridianSegments.push({ a: positions[i], b: positions[i + 1], color: meridian.color, meridianId: meridian.id });
      }
      meridian.points.forEach((point, idx) => {
        acupoints.push({
          pos: positions[idx],
          meridian, point, side,
          color: meridian.color,
          screen: null,
        });
      });
    });
  });

  // ---- État de sélection ----
  let selectedMeridianId = null;
  let selectedAcupoint = null;

  function isMeridianActive(id) { return !selectedMeridianId || selectedMeridianId === id; }
  function isOrganActive(key) {
    if (!selectedMeridianId) return null; // null = état neutre
    const m = MERIDIANS.find((mm) => mm.id === selectedMeridianId);
    return m && m.organKey === key;
  }

  // ---- UI : légende des méridiens ----
  function buildLegend() {
    legendList.innerHTML = '';
    MERIDIANS.forEach((m) => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.style.setProperty('--chip-color', m.color);
      chip.innerHTML = `<span class="dot" style="background:${m.color}"></span><span class="code">${m.id}</span>${m.name}`;
      chip.addEventListener('click', () => toggleMeridian(m.id));
      legendList.appendChild(chip);
    });
  }
  buildLegend();

  function highlightChip(id) {
    Array.from(legendList.children).forEach((chip, i) => {
      chip.classList.toggle('active', MERIDIANS[i].id === id);
    });
  }

  function toggleMeridian(id) {
    dismissHint();
    if (selectedMeridianId === id) {
      selectedMeridianId = null;
      highlightChip(null);
      setAccent(null);
      hideInfoPanel();
    } else {
      selectedMeridianId = id;
      selectedAcupoint = null;
      highlightChip(id);
      showMeridianInfo(MERIDIANS.find((m) => m.id === id));
    }
  }

  function showMeridianInfo(meridian) {
    setAccent(meridian.color);
    infoPanel.classList.add('open');
    infoTitle.innerHTML = `<span class="code">${meridian.id}</span>${meridian.name}`;
    infoSub.textContent = `${meridian.namePinyin} · ${meridian.yinYang}`;
    infoBody.innerHTML = `
      <div class="meta-row">
        <span class="meta"><span class="k">Élément</span><span class="v">${meridian.element}</span></span>
        <span class="meta"><span class="k">Organe</span><span class="v">${meridian.organ}</span></span>
        <span class="meta"><span class="k">Points</span><span class="v">${meridian.points.length}</span></span>
      </div>
      <p>${meridian.description}</p>
      <div class="section-label">Points du canal</div>
      <div class="point-list">
        ${meridian.points.map((p) => `<button class="point-chip" data-point="${p.id}"><span class="code">${p.id}</span>${p.name}</button>`).join('')}
      </div>
      <p class="disclaimer">${DISCLAIMER}</p>
    `;
    infoBody.querySelectorAll('.point-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        const p = meridian.points.find((pt) => pt.id === btn.dataset.point);
        showPointInfo(meridian, p, 'R');
        focusOnPosition(p.pos);
      });
    });
    requestAnimationFrame(() => updateSceneShift(true));
  }

  function showPointInfo(meridian, point, side) {
    dismissHint();
    setAccent(meridian.color);
    selectedAcupoint = { meridian, point, side };
    infoPanel.classList.add('open');
    infoTitle.innerHTML = `<span class="code">${point.id}</span>${point.name}`;
    infoSub.textContent = `« ${point.trad} »`;
    const sideLabel = side === 'L' ? 'Côté gauche' : side === 'R' ? 'Côté droit' : 'Ligne médiane';
    infoBody.innerHTML = `
      <div class="meta-row">
        <span class="meta"><span class="k">Canal</span><span class="v">${meridian.name}</span></span>
        <span class="meta"><span class="k">Organe</span><span class="v">${meridian.organ}</span></span>
        <span class="meta"><span class="k">Côté</span><span class="v">${sideLabel}</span></span>
      </div>
      <div class="section-label">Indications principales</div>
      <p>${point.info}</p>
      <div class="section-label">Autres points du canal ${meridian.id}</div>
      <div class="point-list">
        ${meridian.points.filter((p) => p.id !== point.id).map((p) => `<button class="point-chip" data-point="${p.id}"><span class="code">${p.id}</span>${p.name}</button>`).join('')}
      </div>
      <p class="disclaimer">${DISCLAIMER}</p>
    `;
    infoBody.querySelectorAll('.point-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        const p = meridian.points.find((pt) => pt.id === btn.dataset.point);
        showPointInfo(meridian, p, side);
        focusOnPosition(p.pos);
      });
    });
    requestAnimationFrame(() => updateSceneShift(true));
  }

  function hideInfoPanel() {
    infoPanel.classList.remove('open');
    selectedAcupoint = null;
    updateSceneShift(false);
  }

  infoClose.addEventListener('click', () => {
    hideInfoPanel();
    selectedMeridianId = null;
    highlightChip(null);
    setAccent(null);
  });

  btnAll.addEventListener('click', () => {
    selectedMeridianId = null;
    highlightChip(null);
    setAccent(null);
    hideInfoPanel();
  });

  function focusOnPosition(pos) {
    engine.camera.target = [0, pos[1], 0];
  }

  function setView(theta) {
    engine.camera.theta = theta;
    engine.camera.phi = 1.42;
  }
  btnFront.addEventListener('click', () => setView(0));
  btnBack.addEventListener('click', () => setView(Math.PI));
  btnReset.addEventListener('click', () => {
    engine.camera.target = [0, 1.05, 0];
    engine.camera.radius = 2.6;
    engine.camera.theta = 0.25;
    engine.camera.phi = 1.42;
    selectedMeridianId = null;
    highlightChip(null);
    setAccent(null);
    hideInfoPanel();
  });

  // ---- Recherche ----
  const allPointsFlat = [];
  MERIDIANS.forEach((m) => m.points.forEach((p) => allPointsFlat.push({ meridian: m, point: p })));

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!q) { searchResults.classList.remove('open'); return; }
    const matches = allPointsFlat.filter(({ point }) =>
      point.id.toLowerCase().includes(q) || point.name.toLowerCase().includes(q) || point.trad.toLowerCase().includes(q)
    ).slice(0, 12);
    if (matches.length === 0) { searchResults.classList.remove('open'); return; }
    searchResults.classList.add('open');
    matches.forEach(({ meridian, point }) => {
      const item = document.createElement('div');
      item.className = 'search-item';
      item.innerHTML = `<span class="dot" style="background:${meridian.color}"></span><span class="code">${point.id}</span> ${point.name} <small>${meridian.name}</small>`;
      item.addEventListener('click', () => {
        selectedMeridianId = meridian.id;
        highlightChip(meridian.id);
        showPointInfo(meridian, point, 'R');
        focusOnPosition(point.pos);
        searchResults.classList.remove('open');
        searchInput.value = '';
        searchInput.blur();
      });
      searchResults.appendChild(item);
    });
  });

  // ---- Tap / clic : sélection d'un point d'acupression ----
  let pointerDownInfo = null;
  canvas.addEventListener('pointerdown', (e) => {
    pointerDownInfo = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  canvas.addEventListener('pointerup', (e) => {
    if (!pointerDownInfo) return;
    const dx = e.clientX - pointerDownInfo.x;
    const dy = e.clientY - pointerDownInfo.y;
    const moved = Math.sqrt(dx * dx + dy * dy);
    const dt = Date.now() - pointerDownInfo.t;
    pointerDownInfo = null;
    if (moved > 8 || dt > 500) return; // c'était un glissé, pas un tap

    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const hitRadius = 20;
    let best = null;
    let bestDist = Infinity;
    acupoints.forEach((ap) => {
      if (!ap.screen) return;
      const ddx = ap.screen.x - px;
      const ddy = ap.screen.y - py;
      const d2 = ddx * ddx + ddy * ddy;
      if (d2 <= hitRadius * hitRadius && ap.screen.dist < bestDist) {
        bestDist = ap.screen.dist;
        best = ap;
      }
    });
    if (best) {
      selectedMeridianId = best.meridian.id;
      highlightChip(best.meridian.id);
      showPointInfo(best.meridian, best.point, best.side);
    } else {
      dismissHint();
    }
  });

  // ---- Boucle de rendu ----
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const colorCache = new Map();
  function rgba(hex, alpha) {
    let rgb = colorCache.get(hex);
    if (!rgb) { rgb = hexToRgb(hex); colorCache.set(hex, rgb); }
    return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
  }

  function render() {
    const ctx = engine.ctx;
    engine.camera.occludedBottom += (occludedTarget.bottom - engine.camera.occludedBottom) * 0.16;
    engine.camera.occludedRight += (occludedTarget.right - engine.camera.occludedRight) * 0.16;
    const basis = engine.getBasis();
    const w = engine.width, h = engine.height;
    ctx.clearRect(0, 0, w, h);

    // Fond dégradé
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#101c30');
    grad.addColorStop(1, '#070c17');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const drawList = [];

    // Sol (cercle au niveau des pieds)
    const groundPts = [];
    const groundN = 40;
    for (let i = 0; i < groundN; i++) {
      const a = (i / groundN) * Math.PI * 2;
      const p = engine.project([Math.cos(a) * 0.9, 0, Math.sin(a) * 0.9], basis);
      if (p) groundPts.push(p);
    }
    if (groundPts.length === groundN) {
      const avgDist = groundPts.reduce((s, p) => s + p.dist, 0) / groundN;
      drawList.push({
        dist: avgDist + 3,
        draw: () => {
          ctx.beginPath();
          groundPts.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
          ctx.closePath();
          ctx.fillStyle = 'rgba(30,50,80,0.35)';
          ctx.fill();
        },
      });
    }

    // Corps : maillage anatomique. On projette d'abord tous les sommets,
    // puis on écarte les facettes tournées vers l'arrière (invisibles).
    const pos = bodyMesh.positions;
    for (let i = 0; i < vertexCount; i++) {
      const pr = engine.project([pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]], basis);
      if (pr) { projX[i] = pr.x; projY[i] = pr.y; projDist[i] = pr.dist; }
      else { projDist[i] = -1; }
    }
    const camPos = basis.camPos;
    for (let i = 0; i < bodyMesh.parts.length; i++) {
      const ctr = bodyMesh.parts[i].centroid;
      const pr = engine.project(ctr, basis);
      partDepth[i] = pr ? pr.dist : 1e6;
    }
    for (let f = 0; f < bodyMesh.faces.length; f++) {
      const face = bodyMesh.faces[f];
      const c = face.center, n = face.n;
      // Facette cachée : sa normale s'éloigne de la caméra
      if (n[0] * (c[0] - camPos[0]) + n[1] * (c[1] - camPos[1]) + n[2] * (c[2] - camPos[2]) >= 0) continue;
      const da = projDist[face.a], db = projDist[face.b], dc = projDist[face.c], dd = projDist[face.d];
      if (da < 0 || db < 0 || dc < 0 || dd < 0) continue;
      const ax = projX[face.a], ay = projY[face.a];
      const bx = projX[face.b], by = projY[face.b];
      const cx = projX[face.c], cy = projY[face.c];
      const dx = projX[face.d], dy = projY[face.d];
      const color = face.color;
      drawList.push({
        key: partDepth[face.part],
        dist: (da + db + dc + dd) * 0.25,
        draw: () => {
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.lineTo(cx, cy);
          ctx.lineTo(dx, dy);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
          // Le contour de même teinte comble les fissures d'anticrénelage
          // entre facettes voisines.
          ctx.strokeStyle = color;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        },
      });
    }

    // Organes : le corps est opaque, l'organe du canal sélectionné est donc
    // dessiné par-dessus, en transparence, comme une vue en transparence.
    organParts.forEach((part) => {
      if (isOrganActive(part.organKey) !== true) return;
      const p = engine.project(part.pos, basis);
      if (!p) return;
      const r = Math.max(0.5, part.radius * p.scale);
      drawList.push({
        dist: -2, // toujours au-dessus du corps
        draw: () => {
          ctx.save();
          ctx.shadowColor = part.color;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = rgba(part.color, 0.42);
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = rgba(part.color, 0.85);
          ctx.stroke();
          ctx.restore();
        },
      });
    });

    // Segments de méridiens
    meridianSegments.forEach((seg) => {
      const isSelectedOne = selectedMeridianId === seg.meridianId;
      const neutral = !selectedMeridianId;
      const opacity = isSelectedOne ? 0.95 : neutral ? 0.4 : 0.06;
      const width = isSelectedOne ? 2.6 : neutral ? 1.3 : 1;
      const pa = engine.project(seg.a, basis);
      const pb = engine.project(seg.b, basis);
      if (!pa || !pb) return;
      const dist = (pa.dist + pb.dist) / 2 - 0.012;
      drawList.push({
        dist,
        draw: () => {
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.strokeStyle = rgba(seg.color, opacity);
          ctx.lineWidth = width;
          ctx.stroke();
        },
      });
    });

    // Points d'acupression
    const t = performance.now() * 0.002;
    acupoints.forEach((ap) => {
      const p = engine.project(ap.pos, basis);
      ap.screen = p;
      if (!p) return;
      const active = isMeridianActive(ap.meridian.id);
      const isSelected = selectedAcupoint && selectedAcupoint.point.id === ap.point.id && selectedAcupoint.side === ap.side;
      const baseR = Math.max(active ? 4.5 : 1.8, 0.012 * p.scale * (active ? 1 : 0.5));
      const pulse = active ? (0.5 + Math.sin(t * 2.2 + ap.pos[1] * 5) * 0.15) : 0;
      const opacity = active ? Math.min(1, 0.5 + pulse) : 0.22;
      drawList.push({
        dist: p.dist - 0.022,
        draw: () => {
          if (active) {
            ctx.save();
            ctx.shadowColor = ap.color;
            ctx.shadowBlur = isSelected ? 16 : 8;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, isSelected ? baseR * 1.6 : baseR, 0, Math.PI * 2);
          ctx.fillStyle = rgba(ap.color, opacity);
          ctx.fill();
          if (isSelected) {
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
          }
          if (active) ctx.restore();
        },
      });
    });

    // Tri du peintre : d'abord la clé de groupe (partie du corps pour le
    // maillage, profondeur propre pour le reste), puis la profondeur exacte.
    for (let i = 0; i < drawList.length; i++) {
      if (drawList[i].key === undefined) drawList[i].key = drawList[i].dist;
    }
    drawList.sort((a, b) => (b.key - a.key) || (b.dist - a.dist));
    drawList.forEach((item) => item.draw());

    requestAnimationFrame(render);
  }

  window.addEventListener('resize', () => updateSceneShift(infoPanel.classList.contains('open')));

  if (loadingEl) loadingEl.remove();
  requestAnimationFrame(render);
})();

</script>
