name: Déployer l'app Méridiens 3D sur GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "meridien-3d-app/**"
      - ".github/workflows/deploy-meridien-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le contenu de l'application
        uses: actions/upload-pages-artifact@v3
        with:
          path: meridien-3d-app

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
